name: Build Custom AdGuardHome IPK (25.12)

on:
  workflow_dispatch:

jobs:
  build-ipk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd build-essential ccache gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev

      - name: Download and extract OpenWrt SDK
        run: |
          mkdir -p sdk
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/armsr/armv8"
          
          echo "正在从 ${BASE_URL}/sha256sums 获取最新的 SDK 文件名..."
          SDK_FILE=$(curl -fsSL "${BASE_URL}/sha256sums" | grep -oP 'openwrt-sdk-.*\.tar\.zst' | head -n 1)
          
          if [ -z "$SDK_FILE" ]; then
            echo "Snapshots SDK 解析失败，尝试从 24.10.0 稳定版读取..."
            BASE_URL="https://downloads.openwrt.org/releases/24.10.0/targets/armsr/armv8"
            SDK_FILE=$(curl -fsSL "${BASE_URL}/sha256sums" | grep -oP 'openwrt-sdk-.*\.tar\.zst' | head -n 1)
          fi

          echo "解析到的 SDK 文件: ${SDK_FILE}"
          echo "正在下载: ${BASE_URL}/${SDK_FILE}"
          curl -fsSL "${BASE_URL}/${SDK_FILE}" -o sdk.tar.zst

          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          rm -f sdk.tar.zst

      - name: Setup feeds and configure
        run: |
          cd sdk
          
          # 1. 以正规软件源 (feeds) 方式注入 kenzok8 仓库
          echo "src-git kenzok8 https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf.default
          ./scripts/feeds update -a
          
          # 2. 安装 luci-app-adguardhome 及其依赖
          ./scripts/feeds install luci-app-adguardhome
          
          # 3. 写入 .config 触发编译规则生成
          echo "CONFIG_PACKAGE_luci-app-adguardhome=m" >> .config
          
          # 4. 生成编译配置
          make defconfig

      - name: Compile luci-app-adguardhome
        run: |
          cd sdk
          # 优先多线程编译，失败则回退单线程打印错误
          make package/luci-app-adguardhome/compile V=s -j$(nproc) || make package/luci-app-adguardhome/compile V=s -j1

      - name: Collect and Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-adguardhome-ipk-25.12
          path: |
            sdk/bin/packages/**/luci-app-adguardhome*.ipk
            sdk/bin/packages/**/adguardhome*.ipk
            sdk/bin/packages/**/luci-i18n-adguardhome*.ipk
