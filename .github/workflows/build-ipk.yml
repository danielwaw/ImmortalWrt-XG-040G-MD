name: Build Custom AdGuardHome IPK

on:
  workflow_dispatch:

jobs:
  build-ipk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd build-essential ccache gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev

      - name: Download and extract OpenWrt 24.10 SDK
        run: |
          mkdir -p sdk
          SDK_URL="https://downloads.openwrt.org/releases/24.10.0/targets/armsr/armv8/openwrt-sdk-24.10.0-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          echo "Downloading SDK from ${SDK_URL}..."
          curl -fsSL "${SDK_URL}" -o sdk.tar.zst
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          rm -f sdk.tar.zst

      - name: Setup feeds and configure
        run: |
          cd sdk
          
          # 1. 以正规软件源 (feeds) 方式注入 kenzok8 仓库
          echo "src-git kenzok8 https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf.default
          ./scripts/feeds update -a
          
          # 2. 安装 luci-app-adguardhome 及其依赖
          ./scripts/feeds install luci-app-adguardhome
          
          # 3. 关键修复：写入 .config 触发编译规则生成
          echo "CONFIG_PACKAGE_luci-app-adguardhome=m" >> .config
          
          # 4. 生成编译配置
          make defconfig

      - name: Compile luci-app-adguardhome
        run: |
          cd sdk
          # 优先多线程编译，失败则回退单线程打印错误
          make package/luci-app-adguardhome/compile V=s -j$(nproc) || make package/luci-app-adguardhome/compile V=s -j1

      - name: Collect and Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-adguardhome-ipk
          path: |
            sdk/bin/packages/**/luci-app-adguardhome*.ipk
            sdk/bin/packages/**/adguardhome*.ipk
            sdk/bin/packages/**/luci-i18n-adguardhome*.ipk
