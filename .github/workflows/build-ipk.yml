name: Build Custom IPKs (Official Tailscale & AdGuardHome)

on:
  workflow_dispatch:

jobs:
  build-ipk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd build-essential ccache gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev

      - name: Download and extract OpenWrt 24.10 SDK
        run: |
          mkdir -p sdk
          SDK_URL="https://downloads.openwrt.org/releases/24.10.0/targets/armsr/armv8/openwrt-sdk-24.10.0-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          echo "Downloading SDK from ${SDK_URL}..."
          curl -fsSL "${SDK_URL}" -o sdk.tar.zst
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          rm -f sdk.tar.zst

      - name: Setup feeds and update
        run: |
          cd sdk
          # 1. 注入 kenzok8 源 (仅用于 AdGuardHome)
          echo "src-git kenzok8 https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf.default
          
          # 2. 更新并安装所有 feeds (包含官方 luci 源中的原版 Tailscale)
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 3. 生成基础配置
          make defconfig

      - name: Compile Official Tailscale IPK
        run: |
          cd sdk
          # 明确指定官方 luci 源中的 target 路径，避免 SDK 找不到 Makefile
          make package/feeds/luci/luci-app-tailscale/compile V=s -j$(nproc) || make package/feeds/luci/luci-app-tailscale/compile V=s -j1

      - name: Compile AdGuardHome IPK
        run: |
          cd sdk
          # 明确指定 kenzok8 源中的 target 路径
          make package/feeds/kenzok8/luci-app-adguardhome/compile V=s -j$(nproc) || make package/feeds/kenzok8/luci-app-adguardhome/compile V=s -j1

      - name: Collect and Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-openwrt-ipks-24.10
          path: |
            sdk/bin/packages/**/luci-app-tailscale*.ipk
            sdk/bin/packages/**/tailscale*.ipk
            sdk/bin/packages/**/luci-app-adguardhome*.ipk
            sdk/bin/packages/**/adguardhome*.ipk
            sdk/bin/packages/**/luci-i18n-*-zh-cn*.ipk
