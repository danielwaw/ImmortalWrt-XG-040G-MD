name: Build ImmortalWrt 25.12 for XG-040G-MD

on:
  workflow_dispatch:
    inputs:
      repo_branch:
        description: '选择编译分支'
        required: true
        default: 'openwrt-25.12-XG-040G-MD'
        type: choice
        options:
          - openwrt-25.12-XG-040G-MD
          - master-XG-040G-MD

env:
  REPO_URL: https://github.com/fzs209/immortalwrt.git
  DEVICE_TARGET: airoha
  DEVICE_SUBTARGET: an7581
  
  # 配置指向源码仓库内部的相对路径
  CONFIG_FILE: config/xg-040g-md.config
  
  CACHE_TOOLCHAIN: true
  FIRMWARE_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
      # ==================================================
      # 1. Checkout 当前 GitHub 仓库
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # 2. 检查 GitHub Runner
      # ==================================================
      - name: Check server performance
        run: |
          echo "========================================"
          echo "CPU 信息"
          echo "========================================"
          echo "CPU 核心数: $(nproc)"
          lscpu | grep -E 'Architecture|Model name|CPU\(s\)' || true
          
          echo
          echo "========================================"
          echo "磁盘与内存"
          echo "========================================"
          free -h
          df -hT

      # ==================================================
      # 3. 初始化编译环境
      # ==================================================
      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt-get update
          sudo -E apt-get install -y dos2unix libfuse-dev
          sudo systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"

      # ==================================================
      # 4. 最大化可用磁盘空间
      # ==================================================
      - name: Combine Disks
        uses: easimon/maximize-build-space@v5
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 100
          root-reserve-mb: 1024

      # ==================================================
      # 5. Clone ImmortalWrt
      # ==================================================
      - name: Clone Source Code
        env:
          REPO_BRANCH: ${{ github.event.inputs.repo_branch }}
        run: |
          git clone --depth=1 --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          
          echo "OPENWRT_PATH=$PWD" >> "$GITHUB_ENV"
          echo "REPO_BRANCH=$REPO_BRANCH" >> "$GITHUB_ENV"
          
          VERSION_INFO="$(git show -s --date=short --format='作者: %an<br/>时间: %cd<br/>提交: %s<br/>Commit: %H')"
          {
            echo "VERSION_INFO<<EOF"
            echo "$VERSION_INFO"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # ==================================================
      # 6. 生成环境变量
      # ==================================================
      - name: Generate Variables
        run: |
          SOURCE_REPO="$(basename "$REPO_URL" .git)"
          RELEASE_TAG="XG-040G-MD-25.12-$(date +\%Y\%m\%d)-${{ github.run_number }}"
          
          echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_ENV"
          echo "DEVICE_TARGET=$DEVICE_TARGET" >> "$GITHUB_ENV"
          echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      # ==================================================
      # 7. Toolchain Cache
      # ==================================================
      - name: Cache Toolchain
        if: env.CACHE_TOOLCHAIN == 'true'
        uses: HiGarfield/cachewrtbuild@main
        with:
          ccache: false
          mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
          prefix: ${{ env.OPENWRT_PATH }}

      # ==================================================
      # 8. 更新 Feeds
      # ==================================================
      - name: Install Feeds
        run: |
          cd "$OPENWRT_PATH"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==================================================
      # 9. 加载源码仓库自带的默认配置 (核心修复)
      # ==================================================
      - name: Load Custom Configuration
        run: |
          echo "========================================"
          echo "加载源码仓库默认配置"
          echo "========================================"
          
          # 直接读取克隆下来的 openwrt 源码目录中的配置
          SOURCE_CONFIG_PATH="$OPENWRT_PATH/$CONFIG_FILE"

          if [ -f "$SOURCE_CONFIG_PATH" ]; then
            echo "✅ 成功找到上游默认配置文件: $SOURCE_CONFIG_PATH"
            cp "$SOURCE_CONFIG_PATH" "$OPENWRT_PATH/.config"
          else
            echo "⚠️ 未找到上游特供配置文件，将使用默认模板生成"
          fi

          cd "$OPENWRT_PATH"
          make defconfig

          echo
          echo "==== 检查关键依赖 ===="
          grep -E 'CONFIG_TARGET_airoha|CONFIG_TARGET_DEVICE_' .config || true
          grep -E 'CONFIG_PACKAGE_luci-app-airoha-npu|CONFIG_PACKAGE_.*airoha.*npu' .config || true

      # ==================================================
      # 10. 下载源码包
      # ==================================================
      - name: Download DL Package
        run: |
          cd "$OPENWRT_PATH"
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      # ==================================================
      # 11. 编译
      # ==================================================
      - name: Compile Firmware
        id: compile
        run: |
          cd "$OPENWRT_PATH"
          THREADS="$(nproc)"
          
          echo "开始编译 ImmortalWrt (线程数: $THREADS)"

          if make -j"$THREADS"; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "多线程编译失败，开始单线程重新编译..."
            if make -j1; then
              echo "status=success" >> "$GITHUB_OUTPUT"
            else
              echo "单线程仍然失败，开始 V=s 详细日志编译..."
              make -j1 V=s
              echo "status=failure" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

          echo "DATE=$(date '+\%Y-\%m-\%d \%H:\%M:\%S')" >> "$GITHUB_ENV"
          echo "FILE_DATE=$(date '+\%Y.\%m.\%d')" >> "$GITHUB_ENV"

      # ==================================================
      # 12. 检查磁盘空间
      # ==================================================
      - name: Check Space Usage
        if: always()
        run: df -hT

      # ==================================================
      # 13. 整理固件
      # ==================================================
      - name: Organize Files
        if: steps.compile.outputs.status == 'success'
        run: |
          TARGET_DIR="$OPENWRT_PATH/bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET"
          
          if [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: 找不到固件目录"
            exit 1
          fi

          cd "$TARGET_DIR"
          
          if [ -f sha256sums ]; then
            cat sha256sums
          fi
          
          cp "$OPENWRT_PATH/.config" build.config
          echo "FIRMWARE_PATH=$TARGET_DIR" >> "$GITHUB_ENV"

      # ==================================================
      # 14. 上传 GitHub Artifact
      # ==================================================
      - name: Upload Firmware Artifact
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: XG-040G-MD-25.12-${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE_PATH }}/*
          if-no-files-found: error
          retention-days: 14

      # ==================================================
      # 15. 创建 GitHub Release
      # ==================================================
      - name: Upload Firmware To Release
        if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.RELEASE_TAG }}
          tag: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.FIRMWARE_PATH }}/*
          allowUpdates: true
          replacesArtifacts: true
          body: |
            # ImmortalWrt 25.12 - Nokia XG-040G-MD

            ## 固件信息
            - 设备：Nokia / Bell XG-040G-MD
            - SoC：Airoha AN7581
            - ImmortalWrt 分支：`${{ env.REPO_BRANCH }}`
            - 默认管理地址：`192.168.1.1`
            - 默认密码：无
            - 编译时间：`${{ env.DATE }}`

            ## 源码信息
            `${{ env.REPO_URL }}`
            ${{ env.VERSION_INFO }}

            ## 刷机提示
            - 本固件直接集成上游最新 XG-040G-MD 相关补丁。
            - 首次刷机前请确认当前 Bootloader / tcboot 支持的镜像类型。
