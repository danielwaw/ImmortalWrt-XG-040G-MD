name: stable-XG-040G-MD

on:
  workflow_dispatch:
    inputs:
      repo_branch:
        description: '选择编译分支'
        required: true
        default: 'master-XG-040G-MD'
        type: choice
        options:
          - master-XG-040G-MD
          - openwrt-25.12-XG-040G-MD

env:
  REPO_URL: https://github.com/fzs209/immortalwrt.git
  DEVICE_TARGET: airoha
  DEVICE_SUBTARGET: an7581
  CONFIG_FILE: config/xg-040g-md.config

  # 启用 OpenWrt 构建缓存
  CACHE_TOOLCHAIN: true

  # 是否上传整个 bin 目录
  UPLOAD_BIN_DIR: false

  # 是否创建 GitHub Release
  FIRMWARE_RELEASE: true

  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:

    # ============================================================
    # 1. 检查 GitHub Runner
    # ============================================================
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "========================================"
        echo "GitHub Actions Runner 信息"
        echo "========================================"

        echo "CPU 核心数：$(nproc)"
        echo "CPU 型号："
        lscpu | grep -E 'Model name|Architecture|CPU\(s\)' || true

        echo
        echo "内存："
        free -h

        echo
        echo "磁盘："
        df -hT

    # ============================================================
    # 2. 初始化编译环境
    # ============================================================
    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

        sudo -E apt -yqq install dos2unix libfuse-dev

        sudo -E apt -yqq autoremove --purge
        sudo -E apt -yqq autoclean
        sudo -E apt -yqq clean

        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    # ============================================================
    # 3. 最大化可用磁盘空间
    # ============================================================
    - name: Combine Disks(合并磁盘)
      uses: easimon/maximize-build-space@v5
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    # ============================================================
    # 4. Checkout 当前仓库
    # ============================================================
    - name: Checkout
      uses: actions/checkout@v4

    # ============================================================
    # 5. Clone ImmortalWrt 源码
    # ============================================================
    - name: Clone Source Code(克隆源代码)
      env:
        REPO_BRANCH: ${{ github.event.inputs.repo_branch }}
      run: |
        echo "========================================"
        echo "克隆 ImmortalWrt"
        echo "========================================"

        echo "仓库：$REPO_URL"
        echo "分支：$REPO_BRANCH"

        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt

        cd openwrt

        echo "OPENWRT_PATH=$PWD" >> "$GITHUB_ENV"
        echo "REPO_BRANCH=$REPO_BRANCH" >> "$GITHUB_ENV"
        OPENWRT_COMMIT="$(git rev-parse HEAD)"
        echo "OPENWRT_COMMIT=$OPENWRT_COMMIT" >> "$GITHUB_ENV"

        VERSION_INFO=$(git show -s --date=short \
          --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")

        echo "VERSION_INFO=$VERSION_INFO" >> "$GITHUB_ENV"

        echo
        echo "源码 Commit："
        git rev-parse HEAD

    # ============================================================
    # 6. 生成变量
    # ============================================================
    - name: Generate Variables(生成变量)
      run: |
        SOURCE_REPO="$(basename "$REPO_URL" .git)"

        echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_ENV"
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> "$GITHUB_ENV"
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> "$GITHUB_ENV"

        RELEASE_TAG="XG-040G-MD-$(date +'%Y%m%d')-${{ github.run_number }}"
        echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

    # ============================================================
    # 7. OpenWrt 构建缓存
    #
    # 这里保留原来的 cachewrtbuild。
    #
    # 作用：
    # - 复用之前已经编译好的 toolchain
    # - 复用 kernel/build_dir/staging_dir 中可以复用的内容
    # - 本次新增 PON 包仍然需要第一次编译
    # - ccache 仍关闭，避免额外占用大量空间
    # ============================================================
    - name: Cache Toolchain(缓存构建内容)
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false

        # 保持与之前构建一致的 cache key，
        # 尽量复用你之前已经成功编译的内容。
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}

        prefix: ${{ env.OPENWRT_PATH }}

    # ============================================================
    # 8. 添加 PON Feeds
    #
    # 必须在 feeds update / install 之前添加。
    # ============================================================
    - name: Add PON Feeds(添加 PON 源)
      run: |
        cd "$OPENWRT_PATH"

        echo "========================================"
        echo "添加 Airoha PON Feeds"
        echo "========================================"

        grep -q '^src-git pon_drivers ' feeds.conf.default || \
          echo "src-git pon_drivers https://github.com/pbs05/openwrt-pon-drivers.git" >> feeds.conf.default

        grep -q '^src-git pon_userspace ' feeds.conf.default || \
          echo "src-git pon_userspace https://github.com/pbs05/openwrt-pon-userspace.git" >> feeds.conf.default

        echo
        echo "当前 PON Feeds："
        grep -E 'pon_drivers|pon_userspace' feeds.conf.default || true

    # ============================================================
    # 9. 更新 / 安装 Feeds
    # ============================================================
    - name: Install Feeds(安装 feeds)
      run: |
        cd "$OPENWRT_PATH"

        echo "========================================"
        echo "更新 Feeds"
        echo "========================================"

        ./scripts/feeds update -a

        echo
        echo "========================================"
        echo "安装 Feeds"
        echo "========================================"

        ./scripts/feeds install -a

    # ============================================================
    # 10. 缓存 OpenWrt DL 源码包
    #
    # cachewrtbuild 负责 build_dir/staging_dir/toolchain；
    # actions/cache 额外缓存 dl，避免每次重复下载源码包。
    # ============================================================
    - name: Cache DL Sources(缓存下载源码)
      uses: actions/cache@v4
      with:
        path: ${{ env.OPENWRT_PATH }}/dl
        key: ${{ runner.os }}-openwrt-dl-${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.OPENWRT_COMMIT }}
        restore-keys: |
          ${{ runner.os }}-openwrt-dl-${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-

    # ============================================================
    # 10.5. 修补 EN7572 的 I2C 包依赖
    #
    # 这里不再用“第一个 endef”判断 package block。
    # Makefile 允许 define/endef 嵌套，因此必须按 define 层级解析，
    # 否则会把 DEPENDS 插到 KernelPackage 外面，导致：
    #   recipe commences before first target
    #
    # 只修改真正匹配 EN7572 的 KernelPackage，并且要求最终只找到一个。
    # ============================================================
    - name: Patch EN7572 I2C Dependency(修补 EN7572 I2C 依赖)
      run: |
        cd "$OPENWRT_PATH"

        echo "========================================"
        echo "定位并修补 EN7572 KernelPackage"
        echo "========================================"

        python3 <<'PYTHON'
        import re
        from pathlib import Path

        root = Path("feeds/pon_drivers/airoha-pon-frontends")
        if not root.is_dir():
            raise SystemExit(f"ERROR: PON feed 不存在: {root}")

        makefiles = sorted(root.rglob("Makefile"))
        if not makefiles:
            raise SystemExit("ERROR: PON feed 中没有找到 Makefile")

        define_re = re.compile(r"^\s*define\s+(.+?)\s*$", re.I)
        endef_re = re.compile(r"^\s*endef\s*$", re.I)
        kernelpkg_re = re.compile(r"^KernelPackage/", re.I)

        matches = []

        for path in makefiles:
            lines = path.read_text(errors="ignore").splitlines(True)
            i = 0
            while i < len(lines):
                m = define_re.match(lines[i].rstrip("\n"))
                if not m:
                    i += 1
                    continue

                name = m.group(1).strip()
                if not kernelpkg_re.match(name):
                    i += 1
                    continue

                depth = 1
                j = i + 1
                while j < len(lines) and depth:
                    if define_re.match(lines[j].rstrip("\n")):
                        depth += 1
                    elif endef_re.match(lines[j].rstrip("\n")):
                        depth -= 1
                    j += 1

                if depth != 0:
                    raise SystemExit(
                        f"ERROR: {path}:{i+1} 的 {name} 没有找到匹配的 endef"
                    )

                block = lines[i:j]
                block_text = "".join(block)
                low = block_text.lower()

                # 匹配 package 名、FILES、TITLE 等任意位置出现的 EN7572 标识。
                if not (
                    "en7572" in name.lower()
                    or "kmod-airoha-en7572" in low
                    or "en7572.ko" in low
                ):
                    i = j
                    continue

                matches.append((path, i, j, name, block))
                i = j

        if len(matches) != 1:
            print(f"ERROR: EN7572 KernelPackage 匹配数量 = {len(matches)}，拒绝盲改。")
            if matches:
                for path, i, j, name, block in matches:
                    print(f"  MATCH: {path}:{i+1}-{j} -> {name}")
            print("\n当前 feed 中所有 KernelPackage：")
            for path in makefiles:
                lines = path.read_text(errors="ignore").splitlines(True)
                for lineno, line in enumerate(lines, 1):
                    m = define_re.match(line.rstrip("\n"))
                    if m and kernelpkg_re.match(m.group(1).strip()):
                        print(f"  {path}:{lineno}: {m.group(1).strip()}")
            raise SystemExit(1)

        path, i, j, name, block = matches[0]
        block_text = "".join(block)

        if "+kmod-i2c-core" in block_text:
            print(f"EN7572 package 已经包含 +kmod-i2c-core: {path}:{i+1} -> {name}")
        else:
            # 不改动现有 DEPENDS 行，直接在 KernelPackage define 后追加
            # 一条独立 DEPENDS+=，避免破坏多行续行语法。
            block.insert(1, "  DEPENDS+=+kmod-i2c-core\n")

            lines = path.read_text(errors="ignore").splitlines(True)
            lines[i:j] = block
            path.write_text("".join(lines))
            print(f"已修补: {path}:{i+1} -> {name}")

        print("EN7572 KernelPackage 定位唯一，修改完成。")
        PYTHON

        echo
        echo "========================================"
        echo "打印 EN7572 package 定义"
        echo "========================================"
        grep -R -n -A35 -B3 -E '^define[[:space:]]+KernelPackage/.*en7572' \
          feeds/pon_drivers/airoha-pon-frontends \
          --include='Makefile' || true

        echo
        echo "Makefile 静态检查："
        git diff --check -- feeds/pon_drivers/airoha-pon-frontends

    # ============================================================
    # 11. 加载 XG-040G-MD 原始配置 + PON 配置
    # ============================================================
    - name: Load Custom Configuration(加载自定义配置)
      run: |
        echo "========================================"
        echo "加载 XG-040G-MD 配置"
        echo "========================================"

        SOURCE_CONFIG_PATH="$GITHUB_WORKSPACE/$CONFIG_FILE"

        if [ ! -f "$SOURCE_CONFIG_PATH" ]; then
          echo "ERROR: 找不到配置文件："
          echo "$SOURCE_CONFIG_PATH"
          exit 1
        fi

        echo "配置文件：$SOURCE_CONFIG_PATH"

        cp "$SOURCE_CONFIG_PATH" "$OPENWRT_PATH/.config"

        cd "$OPENWRT_PATH"

        echo
        echo "========================================"
        echo "追加 PON 配置"
        echo "========================================"

        printf '%s\n' \
          'CONFIG_PACKAGE_kmod-airoha-en7572=y' \
          'CONFIG_PACKAGE_kmod-airoha-xpon=y' \
          'CONFIG_PACKAGE_airoha-ponctl=y' \
          'CONFIG_PACKAGE_airoha-pond=y' \
          'CONFIG_PACKAGE_luci-app-pon=y' \
          'CONFIG_PACKAGE_kmod-i2c-an7581=y' \
          'CONFIG_PACKAGE_kmod-i2c-core=y' \
          >> .config

        echo
        echo "========================================"
        echo "执行 make defconfig"
        echo "========================================"

        make defconfig

        echo "========================================"
        echo "检查 Linux I2C 配置"
        echo "========================================"

        echo "--- Kernel I2C symbols (diagnostic only) ---"
        grep -E '^CONFIG_I2C=' .config || true
        grep -E '^CONFIG_I2C_MT7621=' .config || true

        echo
        echo "--- I2C packages ---"
        grep -E '^CONFIG_PACKAGE_kmod-i2c(-an7581|-core)=' .config || true

        echo
        echo "注意：不在顶层 .config 中强制指定 CONFIG_I2C=m；
        kmod-i2c-core / kmod-i2c-an7581 的 KCONFIG 由 OpenWrt KernelPackage 管理。"

        echo
        echo "========================================"
        echo "检查实际生成的 I2C 内核模块"
        echo "========================================"

        find "$OPENWRT_PATH/build_dir" \
        \( \
        -name 'i2c-core.ko' \
        -o -name 'i2c-dev.ko' \
        -o -name 'i2c-mt7621.ko' \
        \) \
        -print 2>/dev/null || true

        echo
        echo "========================================"
        echo "检查 AN7581 Target"
        echo "========================================"

        grep -E \
          'CONFIG_TARGET_airoha|CONFIG_TARGET_DEVICE_|CONFIG_LINUX_' \
          .config || true

        echo
        echo "========================================"
        echo "检查 Airoha NPU"
        echo "========================================"

        grep -E \
          'CONFIG_PACKAGE_airoha-en7581-mt7996-npu-firmware|CONFIG_PACKAGE_kmod-airoha-npu|CONFIG_PACKAGE_luci-app-airoha-npu' \
          .config || true

        echo
        echo "========================================"
        echo "检查 PON 配置"
        echo "========================================"

        grep -E \
          'CONFIG_PACKAGE_(kmod-airoha-en7572|kmod-airoha-xpon|airoha-ponctl|airoha-pond|luci-app-pon|kmod-i2c-an7581|kmod-i2c-core)=' \
          .config || true

        echo
        echo "========================================"
        echo "检查关键配置是否正确"
        echo "========================================"

        if ! grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_bell_xg-040g-md=y$' .config; then
          echo "ERROR: XG-040G-MD target 配置没有正确启用！"
          exit 1
        fi

        if ! grep -q '^CONFIG_PACKAGE_kmod-airoha-en7572=y$' .config; then
          echo "ERROR: kmod-airoha-en7572 没有启用！"
          exit 1
        fi

        if ! grep -q '^CONFIG_PACKAGE_kmod-airoha-xpon=y$' .config; then
          echo "ERROR: kmod-airoha-xpon 没有启用！"
          exit 1
        fi

        if ! grep -q '^CONFIG_PACKAGE_kmod-i2c-core=y$' .config; then
          echo "ERROR: kmod-i2c-core 没有启用！"
          exit 1
        fi

        echo
        echo "配置检查通过。"

    # ============================================================
    # 11.5. 在正式下载/编译前验证 PON package Makefile
    # ============================================================
    - name: Validate PON Makefiles(验证 PON Makefile)
      run: |
        cd "$OPENWRT_PATH"

        echo "========================================"
        echo "验证 airoha-pon-frontends Makefile"
        echo "========================================"

        # -n 会完整解析 Makefile；这里不真正执行编译。
        # 如果 patch 破坏了 Makefile 结构，会在这里立即失败。
        make -n package/feeds/pon_drivers/airoha-pon-frontends/compile >/dev/null

        echo "airoha-pon-frontends Makefile 解析通过。"

    # ============================================================
    # 12. 下载源码包
    # ============================================================
    - name: Download DL Package(下载软件包)
      run: |
        cd "$OPENWRT_PATH"

        echo "========================================"
        echo "下载源码包"
        echo "========================================"

        make download -j8

        echo
        echo "检查异常小文件："

        find dl -size -1024c -exec ls -l {} \;

        find dl -size -1024c -exec rm -f {} \;

    # ============================================================
    # 13. 编译
    #
    # 正常：
    #   make -j$(nproc)
    #
    # 如果失败：
    #   首先针对 PON frontends 单独进行 V=s 编译
    #
    # 这样可以直接看到类似：
    #   missing dependencies
    #   missing kernel symbols
    #   Makefile dependency
    #   kernel API
    # 等真正错误。
    # ============================================================
    - name: Compile Firmware(开始编译固件)
      id: compile
      run: |
        cd "$OPENWRT_PATH"

        THREADS="$(nproc)"

        echo "========================================"
        echo "开始编译 ImmortalWrt"
        echo "========================================"
        echo "线程数：$THREADS"
        echo

        if make -j"$THREADS"; then

          echo
          echo "========================================"
          echo "多线程编译成功"
          echo "========================================"

          echo "status=success" >> "$GITHUB_OUTPUT"

        else

          echo
          echo "========================================"
          echo "多线程编译失败"
          echo "开始单独诊断 airoha-pon-frontends"
          echo "========================================"

          if make -j1 V=s \
            package/feeds/pon_drivers/airoha-pon-frontends/compile; then

            echo
            echo "========================================"
            echo "airoha-pon-frontends 单独编译成功"
            echo "继续单线程完整编译"
            echo "========================================"

            if make -j1 V=s; then

              echo "status=success" >> "$GITHUB_OUTPUT"

            else

              echo
              echo "========================================"
              echo "完整编译仍然失败"
              echo "========================================"

              exit 1
            fi

          else

            echo
            echo "========================================"
            echo "airoha-pon-frontends 编译失败"
            echo "以上日志就是详细错误信息"
            echo "========================================"

            exit 1
          fi

        fi

        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> "$GITHUB_ENV"
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> "$GITHUB_ENV"

    # ============================================================
    # 14. 检查磁盘空间
    # ============================================================
    - name: Check Space Usage(检查空间使用情况)
      if: (!cancelled())
      run: |
        echo "========================================"
        echo "磁盘空间"
        echo "========================================"
        df -hT

    # ============================================================
    # 15. 上传整个 bin 目录
    # ============================================================
    - name: Upload Bin Directory(上传完整 bin)
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin
        retention-days: 14

    # ============================================================
    # 16. 整理固件
    # ============================================================
    - name: Organize Files(整理固件)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd "$OPENWRT_PATH/bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET"

        echo "========================================"
        echo "固件文件"
        echo "========================================"

        ls -lah

        echo
        echo "========================================"
        echo "SHA256"
        echo "========================================"

        if [ -f sha256sums ]; then
          cat sha256sums
        fi

        echo
        echo "========================================"
        echo "Kernel 版本"
        echo "========================================"

        echo "VERSION_KERNEL=$(find . -type f -name "*.manifest" \
          -exec grep -oP '^kernel - \K.*?(?=~|-\d+-)' {} \; \
          | head -n1)" >> "$GITHUB_ENV"

        cp "$OPENWRT_PATH/.config" build.config

        # 收集编译出来的第三方包
        mkdir -p packages

        cp -f "$OPENWRT_PATH"/bin/packages/*/*/*.ipk \
          packages/ 2>/dev/null || true

        cp -f "$OPENWRT_PATH"/bin/packages/*/*/*.apk \
          packages/ 2>/dev/null || true

        if [ "$(find packages -type f | wc -l)" -gt 0 ]; then
          tar -zcf Packages.tar.gz packages
        else
          echo "没有额外 packages，跳过 Packages.tar.gz"
        fi

        rm -rf packages feeds.buildinfo version.buildinfo

        echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"

        echo
        echo "========================================"
        echo "最终固件"
        echo "========================================"

        ls -lah

    # ============================================================
    # 17. 上传 Artifact
    # ============================================================
    - name: Upload Firmware To Artifact(上传固件到 Artifact)
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SOURCE_REPO }}-firmware-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}
        retention-days: 14

    # ============================================================
    # 18. 创建 GitHub Release
    # ============================================================
    - name: Upload Firmware To Release(发布固件)
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: ${{ env.RELEASE_TAG }}
        tag: ${{ env.RELEASE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        allowUpdates: true
        replacesArtifacts: true

        body: |
          # ImmortalWrt 25.12 - Nokia XG-040G-MD

          ## 📒 固件信息

          - 设备：Nokia / Bell XG-040G-MD
          - SoC：Airoha AN7581
          - Target：airoha
          - Subtarget：an7581
          - 设备 Profile：bell_xg-040g-md
          - ImmortalWrt 分支：`${{ env.REPO_BRANCH }}`
          - Kernel：`${{ env.VERSION_KERNEL }}`
          - 默认地址：192.168.1.1
          - 默认密码：无
          - 编译时间：`${{ env.DATE }}`

          ## 🔌 PON

          本版本加入 Airoha PON 相关组件：

          - kmod-airoha-en7572
          - kmod-airoha-xpon
          - airoha-ponctl
          - airoha-pond
          - luci-app-pon
          - kmod-i2c-an7581（依赖 kmod-i2c-core）

          ## 🧠 Airoha NPU

          保留 XG-040G-MD 原有：

          - airoha-en7581-mt7996-npu-firmware
          - kmod-airoha-npu
          - luci-app-airoha-npu

          ## 📦 源码

          ${{ env.REPO_URL }}

          ${{ env.VERSION_INFO }}

          ## ⚠️ 刷机提示

          本固件针对 Nokia / Bell XG-040G-MD。

          首次刷入前请确认当前 Bootloader / tcboot 所支持的镜像类型。
