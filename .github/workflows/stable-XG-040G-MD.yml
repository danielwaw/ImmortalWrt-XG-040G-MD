name: XGPON-XG-040G-MD

on:
  workflow_dispatch:
    inputs:
      repo_branch:
        description: '选择编译分支'
        required: true
        default: 'master-XG-040G-MD'
        type: choice
        options:
          - master-XG-040G-MD
          - openwrt-25.12-XG-040G-MD

env:
  REPO_URL: https://github.com/fzs209/immortalwrt.git
  DEVICE_TARGET: airoha
  DEVICE_SUBTARGET: an7581
  CONFIG_FILE: config/xg-040g-md.config

  # 当前 Airoha xPON feeds
  PON_DRIVERS_REPO: https://github.com/pbs05/openwrt-pon-drivers.git
  PON_USERSPACE_REPO: https://github.com/pbs05/openwrt-pon-userspace.git

  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep \"physical id\" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* 2>/dev/null | grep -v [1-9] | wc -l)"
        df -hT

    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt -yqq install dos2unix libfuse-dev
        sudo -E apt -yqq autoremove --purge
        sudo -E apt -yqq autoclean
        sudo -E apt -yqq clean
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    - name: Combine Disks(合并磁盘)
      uses: easimon/maximize-build-space@v5
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone Source Code(克隆源代码)
      env:
        REPO_BRANCH: ${{ github.event.inputs.repo_branch }}
      run: |
        df -hT $GITHUB_WORKSPACE
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        VERSION_INFO=$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")
        echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV
        echo "REPO_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV

    - name: Generate Variables(生成变量)
      run: |
        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
        echo "RELEASE_TAG=XG-040G-MD-xPON-$(date +"%Y%m%d")-${{ github.run_number }}" >> $GITHUB_ENV

    - name: Cache Toolchain(缓存工具链)
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-xpon
        prefix: ${{ env.OPENWRT_PATH }}

    - name: Add xPON Feeds(加入xPON feeds)
      run: |
        cd "$OPENWRT_PATH"

        echo "=========================================="
        echo "加入当前 xPON feeds"
        echo "=========================================="

        echo "src-git pon_drivers $PON_DRIVERS_REPO" >> feeds.conf.default
        echo "src-git pon_userspace $PON_USERSPACE_REPO" >> feeds.conf.default

        grep -E 'pon_drivers|pon_userspace' feeds.conf.default

    - name: Install Feeds(安装feeds)
      run: |
        cd "$OPENWRT_PATH"
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        echo "=========================================="
        echo "检查 xPON packages"
        echo "=========================================="

        for pkg in \
          kmod-airoha-en7572 \
          kmod-airoha-xpon \
          airoha-ponctl \
          airoha-pond \
          luci-app-pon
        do
          if ./scripts/feeds search "$pkg" | grep -q "$pkg"; then
            echo "OK: $pkg"
          else
            echo "ERROR: 未找到 xPON package: $pkg"
            exit 1
          fi
        done

    - name: Load Custom Configuration(加载自定义配置)
      run: |
        SOURCE_CONFIG_PATH="$GITHUB_WORKSPACE/$CONFIG_FILE"

        if [ -e "$SOURCE_CONFIG_PATH" ]; then
          cp "$SOURCE_CONFIG_PATH" "$OPENWRT_PATH/.config"
        else
          echo "ERROR: 找不到配置文件: $SOURCE_CONFIG_PATH"
          exit 1
        fi

        cd "$OPENWRT_PATH"

        echo "=========================================="
        echo "加入 xPON 软件包"
        echo "=========================================="

        printf '%s\n' \
          '# Airoha xPON' \
          'CONFIG_PACKAGE_kmod-airoha-en7572=y' \
          'CONFIG_PACKAGE_kmod-airoha-xpon=y' \
          'CONFIG_PACKAGE_airoha-ponctl=y' \
          'CONFIG_PACKAGE_airoha-pond=y' \
          'CONFIG_PACKAGE_luci-app-pon=y' \
          >> .config

        make defconfig

        echo "=========================================="
        echo "检查目标配置"
        echo "=========================================="

        grep -E 'CONFIG_TARGET_airoha|CONFIG_TARGET_DEVICE_|CONFIG_LINUX_' .config || true

        echo "=========================================="
        echo "检查 NPU"
        echo "=========================================="

        grep -E 'CONFIG_PACKAGE_airoha-npu|CONFIG_PACKAGE_luci-app-airoha-npu|CONFIG_PACKAGE_.*airoha.*npu' .config || echo "WARNING: NPU option missing!"

        echo "=========================================="
        echo "检查 xPON"
        echo "=========================================="

        grep -E 'CONFIG_PACKAGE_(kmod-airoha-en7572|kmod-airoha-xpon|airoha-ponctl|airoha-pond|luci-app-pon)=' .config || true

    - name: Download DL Package(下载DL软件包)
      run: |
        cd $OPENWRT_PATH
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware(开始编译固件)
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo -e "$(nproc) thread compile"
        if make -j$(nproc); then
          echo "status=success" >> $GITHUB_OUTPUT
        elif make -j1; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          make -j1 V=s
          echo "status=failure" >> $GITHUB_OUTPUT
          exit 1
        fi
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Check xPON Build Result(检查xPON编译结果)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd "$OPENWRT_PATH"

        echo "=========================================="
        echo "检查 xPON 编译结果"
        echo "=========================================="

        find bin/packages -type f -name '*.ipk' -print 2>/dev/null | grep -Ei 'en7572|xpon|ponctl|pond|luci-app-pon' || true

        echo "=========================================="
        echo "检查最终 CONFIG"
        echo "=========================================="

        grep -E 'CONFIG_PACKAGE_(kmod-airoha-en7572|kmod-airoha-xpon|airoha-ponctl|airoha-pond|luci-app-pon)=' .config || true

        echo "=========================================="
        echo "检查 Manifest"
        echo "=========================================="

        find bin/targets -type f -name '*.manifest' -print 2>/dev/null | while read -r manifest; do
          echo "--- $manifest ---"
          grep -Ei 'en7572|xpon|ponctl|pond|luci-app-pon' "$manifest" || true
        done

    - name: Check Space Usage(检查空间使用情况)
      if: (!cancelled())
      run: df -hT

    - name: Upload Bin Directory(上传固件)
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin

    - name: Organize Files(整理文件)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        cat sha256sums
        echo "VERSION_KERNEL=$(find -type f -name "*.manifest" -exec grep -oP '^kernel - \K.*?(?=~|-\d+-)' {} \;)" >> $GITHUB_ENV
        cp $OPENWRT_PATH/.config build.config
        mkdir -p packages
        cp -f $OPENWRT_PATH/bin/packages/*/*/*.ipk packages/ 2>/dev/null || true
        cp -f $OPENWRT_PATH/bin/packages/*/*/*.apk packages/ 2>/dev/null || true
        tar -zcf Packages.tar.gz packages
        rm -rf packages feeds.buildinfo version.buildinfo
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware To Artifact(将固件上传到Artifact)
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SOURCE_REPO }}-firmware-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}

    - name: Upload Firmware To Release(发布固件)
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: ${{ env.RELEASE_TAG }}
        tag: ${{ env.RELEASE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          **This is OpenWrt Firmware for XG-040G-MD**
          ### 📒 固件信息(XG-040G-MD)
          - 这是 XG-040G-MD 的专属构建
          - 💻 目标分支：${{ env.REPO_BRANCH }}
          - ⚽ 固件源码: ${{ env.REPO_URL }}
          - 🌐 默认地址: 192.168.1.1
          - 🔑 默认密码: 无
          - 📅 构建时间: ${{ env.DATE }}
          ### 🟢 xPON
          - xPON feeds: pbs05/openwrt-pon-drivers
          - xPON feeds: pbs05/openwrt-pon-userspace
          - 已加入：kmod-airoha-en7572
          - 已加入：kmod-airoha-xpon
          - 已加入：airoha-ponctl
          - 已加入：airoha-pond
          - 已加入：luci-app-pon
          ### 🧊 固件版本
          - 固件内核版本：${{ env.VERSION_KERNEL }}
          - 固件编译前最后一次➦[主源码](${{ env.REPO_URL }})更新记录：
          ${{ env.VERSION_INFO }}
