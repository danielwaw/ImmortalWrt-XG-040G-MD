name: Build ImmortalWrt 24.10 for XG-040G-MD

on:
  workflow_dispatch:
    inputs:
      repo_branch:
        description: '选择编译分支'
        required: true
        default: 'openwrt-24.10'
        type: choice
        options:
          - openwrt-24.10
          - master-XG-040G-MD
          - openwrt-25.12-XG-040G-MD

env:
  REPO_URL: https://github.com/fzs209/immortalwrt.git
  DEVICE_TARGET: airoha
  DEVICE_SUBTARGET: an7581
  CONFIG_FILE: config/xg-040g-md.config
  CACHE_TOOLCHAIN: true
  FIRMWARE_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check server performance
      run: |
        echo "--------------------------CPU信息--------------------------"
        echo "CPU核心数：$(nproc)"
        echo "--------------------------硬盘信息--------------------------"
        df -hT

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt -yqq install dos2unix libfuse-dev
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    - name: Combine Disks
      uses: easimon/maximize-build-space@v5
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: Clone Source Code and Merge Patches
      env:
        REPO_BRANCH: ${{ github.event.inputs.repo_branch }}
      run: |
        # 1. 克隆真正的 openwrt-24.10 分支（无多余后缀）
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        cd openwrt
        
        # 2. 如果选择 24.10，自动把 master-XG-040G-MD 分支的硬件驱动补丁合并进来
        if [ "$REPO_BRANCH" = "openwrt-24.10" ]; then
          echo "==== 正在将 XG-040G-MD 专属硬件补丁注入 24.10 分支 ===="
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin master-XG-040G-MD
          git merge origin/master-XG-040G-MD --no-edit -m "Merge XG-040G-MD hardware patches" || true
        fi

        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        echo "REPO_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV

    - name: Generate Variables
      run: |
        SOURCE_REPO="$(echo$REPO_URL | awk -F '/' '{print $(NF)}' \vert{} sed 's/\.git$//')"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        echo "RELEASE_TAG=XG-040G-MD-24.10-$(date +"%Y%m%d")-${{ github.run_number }}" >> $GITHUB_ENV

    - name: Cache Toolchain
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}

    - name: Install Feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE$OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        make defconfig

    - name: Download DL Package
      run: |
        cd $OPENWRT_PATH
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo "Building with $(nproc) threads..."
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"\%Y-\%m-\%d \%H:\%M:\%S")" >> $GITHUB_ENV

    - name: Organize Files
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        cp $OPENWRT_PATH/.config build.config
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware To Release
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: ${{ env.RELEASE_TAG }}
        tag: ${{ env.RELEASE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          **ImmortalWrt 24.10 Firmware for Nokia XG-040G-MD**
          - 💻 基础分支：${{ env.REPO_BRANCH }}
          - 🛠️ 补丁集成：已自动注入双闪存识别与 NPU 加速驱动补丁
          - 🌐 默认管理 IP: 192.168.1.1
          - 🔑 默认密码: 无
          - 📅 编译时间: ${{ env.DATE }}
          - ⚠️ 刷机说明：首次刷机请在 tcboot (192.168.1.1) Web 界面上传以 `.squashfs-factory.bin` 结尾的文件。
